[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pipesync"
dynamic = ["version"]
description = "Ultra-Low-Latency Multi-Device Audio Sharing & Synchronization for PipeWire & Helvum"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "PipeSync Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.scripts]
pipesync = "pipesync.cli:main"
pipesync-gui = "pipesync.gui.app:main"

[project.urls]
Homepage = "https://github.com/MayurUbarhande0/Pipesync"
Repository = "https://github.com/MayurUbarhande0/Pipesync"
Issues = "https://github.com/MayurUbarhande0/Pipesync/issues"

[tool.setuptools.dynamic]
version = { attr = "pipesync.__version__" }

[tool.setuptools.data-files]
"share/applications" = ["data/org.pipewire.PipeSync.desktop"]
